name: markets-monitor
on:
  schedule:
    - cron: '30 22 * * *'    # 매일 07:30 KST (미국 장 마감·코인 일봉 마감 뒤)
    - cron: '50 7 * * 1-5'   # 평일 16:50 KST (코스피 마감 뒤)
  workflow_dispatch:
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  markets:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/markets.js
      - run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add public/markets.json public/markets_log.json
          git diff --cached --quiet && exit 0
          git commit -m "markets: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
