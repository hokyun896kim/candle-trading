name: monthly-candle-scan
on:
  schedule:
    - cron: '40 7 * * 1-5'   # 평일 16:40 KST
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/scan.js
      - run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add public/scan.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
